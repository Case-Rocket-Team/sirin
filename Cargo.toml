[workspace]
members = [
    "sirin",
    "sirin-macros",
    "sirin-shared",
    "bmp3",
    "dev-csr",
    "dev-csr-macro",
    "lsm6dsv-spi",
    "rfm9",
    "spi-handle",
    "w25qx",
    "sirin-c",
    "sam-m10q",
    "extended-kalman",
    "examples/imu-test",
    "examples/bare",
    "examples/main",
    "examples/dongle",
    "examples/kalman-test",
    "examples/kalman-rust-test",
    "examples/radio-test-send",
    "examples/gps-test",
    "examples/radio-test-receive",
    "examples/any-test",
    "examples/mag-calibrate",
    "examples/allan-variance", 
    "examples/ematch-test"
]
resolver = "2"

[profile.dev]
debug = true
lto = true
opt-level = "z"
incremental = true

[profile.release]
debug = false
lto = true
opt-level = "z"
incremental = true
