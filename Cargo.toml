[workspace]
members = [
    "sirin",
    "sirin-macros",
    "bmp3",
    "dev-csr",
    "dev-csr-macro",
    "h3lis",
    "lsm6dso-spi",
    "rfm9",
    "spi-handle",
    "w25qx",
    "sirin-c",
    "examples/imu-test",
    "examples/bare",
    "examples/h3lis-test",
    "examples/cmsis-dsp-test",
    "examples/main",
    "examples/usb-test"
, "sirin-song", "sirin-song-macros"]
resolver = "2"

[profile.dev]
debug = true
lto = true
opt-level = "z"
incremental = true

[profile.release]
debug = false
lto = true
opt-level = "z"
incremental = true
