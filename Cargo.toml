[workspace]
members = [
    "sirin",
    "sirin-macros",
    "bmp3",
    "dev-csr",
    "dev-csr-macro",
    "h3lis",
    "lsm6dso",
    "rfm9x",
    "spi-handle",
    "w25q",
    "sirin-c",
    "examples/imu-test",
    "examples/bare",
    "examples/h3lis-test",
    "examples/data-test",
    "examples/cmsis-dsp-test"
]
resolver = "2"

[profile.dev]
debug = true
lto = true
opt-level = "z"
incremental = true

[profile.release]
debug = false
lto = true
opt-level = "z"
incremental = true
