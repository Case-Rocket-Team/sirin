[workspace]
members = [
    "sirin",
    "sirin-macros",
    "sirin-shared",
    "bmp3",
    "dev-csr",
    "dev-csr-macro",
    "h3lis",
    "lsm6dso-spi",
    "rfm9",
    "spi-handle",
    "w25qx",
    "sirin-c",
    "sam-m10q",
    "examples/main",
    "examples/imu-test",
    "examples/bare",
    "examples/h3lis-test",
    "examples/nosecone-ebay",
    "examples/dongle",
    "examples/radiotest",
    "examples/ejection-test"
]
resolver = "2"

[profile.dev]
debug = true
lto = true
opt-level = "z"
incremental = true

[profile.release]
debug = false
lto = true
opt-level = "z"
incremental = true
