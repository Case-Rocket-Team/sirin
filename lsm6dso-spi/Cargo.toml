[package]
name = "lsm6dso-spi"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "LSM6DSO Accelerometer/IMU"
repository = "https://github.com/Nautki/sirin"

[dependencies]
defmt = "0.3.8"
dev-csr = { version = "0.1.1", path = "../dev-csr" }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
spi-handle = { version = "0.1.1", path = "../spi-handle" }
uunit = { version = "0.1.0", git = "https://github.com/Nautki/uunit" }

[features]
defmt = []
