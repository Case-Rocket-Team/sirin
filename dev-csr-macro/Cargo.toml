[package]
name = "dev-csr-macro"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Macros for dev-csr"
repository = "https://github.com/Nautki/sirin"

[lib]
proc-macro = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.86"
quote = "1.0.36"
syn = { version = "2.0.68", features = ["full"] }
